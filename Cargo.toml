[package]
name = "client"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
crossterm = "0.27"
unicode-width = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "mdns", "identify", "ping", "request-response", "json", "macros", "upnp"] }
base64 = "0.22"
